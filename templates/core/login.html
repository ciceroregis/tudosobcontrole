{% extends 'core/base.html' %}

{% block title %}Login • Financeiro tudo sob controle{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-dark text-white text-center py-4">
                <i class="bi bi-wallet-fill text-info fs-1"></i>
                <h4 class="fw-bold mb-0 mt-2">Financeiro tudo sob controle</h4>
                <small class="text-white-50">Assuma o controle de suas finanças</small>
            </div>
            <div class="card-body p-4 bg-white">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Login</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Digite seu login" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Digite sua senha" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 mt-2">
                        Entrar no Sistema <i class="bi bi-box-arrow-in-right ms-1"></i>
                    </button>
                </form>
                <hr class="my-4">
                <div class="text-center">
                    <span class="text-muted small">Ainda não tem conta?</span>
                    <a href="{% url 'registro' %}" class="fw-bold text-decoration-none ms-1">Criar novo usuário</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
